<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}body{margin:0;width:1200px;height:630px;overflow:hidden;font-family:Inter,system-ui;background:#0b0f14;color:#eef3f8;position:relative}
.glow{position:absolute;width:700px;height:700px;border-radius:50%;filter:blur(90px);opacity:.45}
.g1{background:#0ea5e9;right:-150px;top:-250px}.g2{background:#6366f1;right:150px;bottom:-420px}
.left{position:absolute;left:70px;top:70px;width:620px}
.brand{display:flex;align-items:center;gap:14px;font-weight:800;font-size:28px}
.brand img{width:56px;height:56px;border-radius:14px}
h1{font-size:62px;line-height:1.04;letter-spacing:-.035em;margin:34px 0 22px;font-weight:800}
h1 span{background:linear-gradient(120deg,#38bdf8,#818cf8);-webkit-background-clip:text;color:transparent}
.chips{display:flex;flex-wrap:wrap;gap:12px}
.chip{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);border-radius:999px;padding:10px 18px;font-size:21px;font-weight:700}
.foot{position:absolute;left:70px;bottom:56px;font-size:22px;color:#9aa7b6;font-weight:500}
.foot b{color:#fff}
.phone{position:absolute;right:120px;top:52px;width:300px;border-radius:40px;overflow:hidden;border:8px solid #000;box-shadow:0 30px 70px rgba(0,0,0,.6);transform:rotate(4deg)}
.phone img{display:block;width:100%}
.tag{position:absolute;right:330px;bottom:170px;background:#fff;color:#0f172a;border-radius:18px;padding:14px 20px;font-weight:800;font-size:22px;box-shadow:0 20px 40px rgba(0,0,0,.4);transform:rotate(-3deg)}
.tag small{display:block;font-weight:600;color:#5b6678;font-size:16px}
</style></head><body>
<div class="glow g1"></div><div class="glow g2"></div>
<div class="left">
 <div class="brand"><img src="public/img/sales/icon.jpg">Get Transcript</div>
 <h1>More leads. <span>Three minutes a post.</span></h1>
 <div class="chips"><span class="chip">Comments</span><span class="chip">Thread posts</span><span class="chip">Faceless posts</span></div>
</div>
<div class="foot">From your phone. <b>No computer.</b> Free · iPhone &amp; Android</div>
<div class="phone"><img src="public/img/sales/post-done.jpg"></div>
<div class="tag">💬 Comment on this post<small>the whole post, read for you</small></div>
</body></html>
